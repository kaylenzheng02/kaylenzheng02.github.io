<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustration — KZHENG_PORTFOLIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="site">
  <nav class="top-nav" aria-label="Primary">
    <a class="top-nav__link" href="../index.html">home</a>
    <a class="top-nav__link" href="work.html">work</a>
    <a class="top-nav__link" href="contact.html">info</a>
  </nav>

  <main class="site-main site-main--page site-main--work-sub">
    <p class="site-main__work-back"><a class="site-main__work-back-link" href="work.html">work</a></p>
    <h1 class="site-main__work-title">Illustration</h1>

    <div class="site-main__illustration-grid">
      <figure class="site-main__illustration-figure">
        <img class="site-main__illustration-img" src="../images/illustration/IMG_1932.PNG" alt="Illustration: forest and vertical forms." loading="lazy" decoding="async">
      </figure>
      <figure class="site-main__illustration-figure">
        <img class="site-main__illustration-img" src="../images/illustration/IMG_1980.PNG" alt="Illustration: two figures in teal field." loading="lazy" decoding="async">
      </figure>
      <figure class="site-main__illustration-figure">
        <img class="site-main__illustration-img" src="../images/illustration/IMG_1981.PNG" alt="Illustration: two figures with red foreground." loading="lazy" decoding="async">
      </figure>
      <figure class="site-main__illustration-figure">
        <img class="site-main__illustration-img" src="../images/illustration/IMG_1983.PNG" alt="Illustration: central figure with red and teal." loading="lazy" decoding="async">
      </figure>
      <figure class="site-main__illustration-figure">
        <img class="site-main__illustration-img" src="../images/illustration/IMG_1990.PNG" alt="Illustration: overlapping figures in red and grey." loading="lazy" decoding="async">
      </figure>
      <figure class="site-main__illustration-figure">
        <img class="site-main__illustration-img" src="../images/illustration/IMG_1992.PNG" alt="Illustration: character with sword, teal background." loading="lazy" decoding="async">
      </figure>
      <figure class="site-main__illustration-figure">
        <img class="site-main__illustration-img" src="../images/illustration/IMG_2001.PNG" alt="Illustration: figure holding paper over one eye." loading="lazy" decoding="async">
      </figure>
    </div>
  </main>

  <div
    class="illustration-lightbox"
    id="illustration-lightbox"
    hidden
    role="dialog"
    aria-modal="true"
    aria-label="Enlarged illustration"
  >
    <button type="button" class="illustration-lightbox__close" aria-label="Close">&times;</button>
    <img class="illustration-lightbox__img" src="" alt="">
  </div>

  <footer class="site-footer">
    <p>© <span data-year></span> KAYLEN ZHENG</p>
  </footer>

  <script src="../hi.js"></script>
</body>
</html>
